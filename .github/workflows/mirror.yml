
name: Mirror RBFBL Live Tracker

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download files
        run: |
          for file in rr_live.htm index.htm rbfbl_tracker.htm; do
            curl --fail --location --retry 3 \
              --connect-timeout 30 --max-time 120 \
              "https://rbfbl.altervista.org/$file" \
              -o "$file.tmp"

            test -s "$file.tmp"
            mv "$file.tmp" "$file"
            git add "$file"
          done

      - name: Commit and publish
        run: |
          git config user.name "RBFBL Mirror"
          git config user.email "actions@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Update RBFBL files"
            git push
          fi
