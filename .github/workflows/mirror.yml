
name: Mirror RBFBL Live Tracker

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download live tracker
        run: |
          curl --fail --location --retry 3 \
            --connect-timeout 30 --max-time 120 \
            "https://rbfbl.altervista.org/rr_live.htm" \
            -o rr_live.tmp
          test -s rr_live.tmp
          mv rr_live.tmp rr_live.htm

      - name: Commit and publish
        run: |
          git config user.name "RBFBL Mirror"
          git config user.email "actions@users.noreply.github.com"
          git add rr_live.htm

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Update live tracker"
            git push
          fi
